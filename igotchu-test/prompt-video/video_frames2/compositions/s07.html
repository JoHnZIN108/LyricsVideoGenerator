="background:#2343E0;color:#fff">4</i><span class="hw"><i class="hb" id="s6b-h0" style="background:rgba(35,67,224,.22)"></i><span>Here’s</span></span> <span class="hw"><i class="hb" id="s6b-h1" style="background:rgba(35,67,224,.22)"></i><span>the</span></span> <span class="hw"><i class="hb" id="s6b-h2" style="background:rgba(35,67,224,.22)"></i><span>birthday</span></span> <span class="hw"><i class="hb" id="s6b-h3" style="background:rgba(35,67,224,.22)"></i><span>message</span></span> <span class="hw"><i class="hb" id="s6b-h4" style="background:rgba(35,67,224,.22)"></i><span>I</span></span> <span class="hw"><i class="hb" id="s6b-h5" style="background:rgba(35,67,224,.22)"></i><span>wrote</span></span> <span class="hw"><i class="hb" id="s6b-h6" style="background:rgba(35,67,224,.22)"></i><span>for</span></span> <span class="hw"><i class="hb" id="s6b-h7" style="background:rgba(35,67,224,.22)"></i><span>my</span></span> <span class="hw"><i class="hb" id="s6b-h8" style="background:rgba(35,67,224,.22)"></i><span>dad</span></span> <span class="hw"><i class="hb" id="s6b-h9" style="background:rgba(35,67,224,.22)"></i><span>this</span></span> <span class="hw"><i class="hb" id="s6b-h10" style="background:rgba(35,67,224,.22)"></i><span>year.</span></span> <span class="hw"><i class="hb" id="s6b-h11" style="background:rgba(35,67,224,.22)"></i><span>Use</span></span> <span class="hw"><i class="hb" id="s6b-h12" style="background:rgba(35,67,224,.22)"></i><span>it</span></span> <span class="hw"><i class="hb" id="s6b-h13" style="background:rgba(35,67,224,.22)"></i><span>as</span></span> <span class="hw"><i class="hb" id="s6b-h14" style="background:rgba(35,67,224,.22)"></i><span>a</span></span> <span class="hw"><i class="hb" id="s6b-h15" style="background:rgba(35,67,224,.22)"></i><span>style</span></span> <span class="hw"><i class="hb" id="s6b-h16" style="background:rgba(35,67,224,.22)"></i><span>and</span></span> <span class="hw"><i class="hb" id="s6b-h17" style="background:rgba(35,67, a(35,67,224,.22)"></i><span>(don’t</span></span> <span class="hw"><i class="hb" id="s6-ds3" style="background:rgba(35,67,224,.22)"></i><span>get</span></span> <span class="hw"><i class="hb" id="s6-ds4" style="background:rgba(35,67,224,.22)"></i><span>emotional).</span></span></p></div></div><div class="rc full" id="s6b-r" style="left:1110px;top:170px;width:700px"><div class="hd"><span class="ai">AI</span><span class="m sm">Reply</span></div><p class="rp" id="s6b-r-p0">Happy 60th, Mum! Thirty years of bossing doctors around, and now you’re free to boss us full-time. Lucky us. <span class="hw"><i class="hb" id="s6b-r-q0" style="background:rgba(35,67,224,.22)"></i><span>Thanks</span></span> <span class="hw"><i class="hb" id="s6b-r-q1" style="background:rgba(35,67,224,.22)"></i><span>for</span></span> <span class="hw"><i class="hb" id="s6b-r-q2" style="background:rgba(35,67,224,.22)"></i><span>every</span></span> <span class="hw"><i class="hb" id="s6b-r-q3" style="background:rgba(35,67,224,.22)"></i><span>plaster,</span></span> <span class="hw"><i class="hb" id="s6b-r-q4" style="background:rgba(35,67,224,.22)"></i><span>every</span></span> <span class="hw"><i class="hb" id="s6b-r-q5" style="background:rgba(35,67,224,.22)"></i><span>pep</span></span> <span class="hw"><i class="hb" id="s6b-r-q6" style="background:rgba(35,67,224,.22)"></i><span>talk,</span></span> <span class="hw"><i class="hb" id="s6b-r-q7" style="background:rgba(35,67,224,.22)"></i><span>and</span></span> <span class="hw"><i class="hb" id="s6b-r-q8" style="background:rgba(35,67,224,.22)"></i><span>every</span></span> <span class="hw"><i class="hb" id="s6b-r-q9" style="background:rgba(35,67,224,.22)"></i><span>“I</span></span> <span class="hw"><i class="hb" id="s6b-r-q10" style="background:rgba(35,67,224,.22)"></i><span>told</span></span> <span class="hw"><i class="hb" id="s6b-r-q11" style="background:rgba(35,67,224,.22)"></i><span>you</span></span> <span class="hw"><i class="hb" id="s6b-r-q12" style="bac
