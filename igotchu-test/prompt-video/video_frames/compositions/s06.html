ize:40px"><i class="tg" style="background:#2343E0;color:#fff">4</i><span class="hw"><i class="hb" id="s6b-h0" style="background:rgba(35,67,224,.22)"></i><span>Here</span></span> <span class="hw"><i class="hb" id="s6b-h1" style="background:rgba(35,67,224,.22)"></i><span>are</span></span> <span class="hw"><i class="hb" id="s6b-h2" style="background:rgba(35,67,224,.22)"></i><span>a</span></span> <span class="hw"><i class="hb" id="s6b-h3" style="background:rgba(35,67,224,.22)"></i><span>few</span></span> <span class="hw"><i class="hb" id="s6b-h4" style="background:rgba(35,67,224,.22)"></i><span>texts</span></span> <span class="hw"><i class="hb" id="s6b-h5" style="background:rgba(35,67,224,.22)"></i><span>I’ve</span></span> <span class="hw"><i class="hb" id="s6b-h6" style="background:rgba(35,67,224,.22)"></i><span>sent</span></span> <span class="hw"><i class="hb" id="s6b-h7" style="background:rgba(35,67,224,.22)"></i><span>her,</span></span> <span class="hw"><i class="hb" id="s6b-h8" style="background:rgba(35,67,224,.22)"></i><span>so</span></span> <span class="hw"><i class="hb" id="s6b-h9" style="background:rgba(35,67,224,.22)"></i><span>you</span></span> <span class="hw"><i class="hb" id="s6b-h10" style="background:rgba(35,67,224,.22)"></i><span>can</span></span> <span class="hw"><i class="hb" id="s6b-h11" style="background:rgba(35,67,224,.22)"></i><span>match</span></span> <span class="hw"><i class="hb" id="s6b-h12" style="background:rgba(35,67,224,.22)"></i><span>how</span></span> <span class="hw"><i class="hb" id="s6b-h13" style="background:rgba(35,67,224,.22)"></i><span>I</span></span> <span class="hw"><i class="hb" id="s6b-h14" style="background:rgba(35,67,224,.22)"></i><span>write:</span></span> <span class="hw"><i class="hb" id="s6b-h15" style="background:rgba(35,67,224,.22)"></i><span>“Mum</span></span> <span class="hw"><i class="hb" id="s6b-h16" style="background:rgba(35,67,224,.22)"></i><span>I</span></span> <span class="hw"><i class="hb" id="s6b-h17" style=" i class="hb" id="s6b-h35" style="background:rgba(35,67,224,.22)"></i><span>series</span></span> <span class="hw"><i class="hb" id="s6b-h36" style="background:rgba(35,67,224,.22)"></i><span>in</span></span> <span class="hw"><i class="hb" id="s6b-h37" style="background:rgba(35,67,224,.22)"></i><span>one</span></span> <span class="hw"><i class="hb" id="s6b-h38" style="background:rgba(35,67,224,.22)"></i><span>night??</span></span> <span class="hw"><i class="hb" id="s6b-h39" style="background:rgba(35,67,224,.22)"></i><span>Who</span></span> <span class="hw"><i class="hb" id="s6b-h40" style="background:rgba(35,67,224,.22)"></i><span>even</span></span> <span class="hw"><i class="hb" id="s6b-h41" style="background:rgba(35,67,224,.22)"></i><span>are</span></span> <span class="hw"><i class="hb" id="s6b-h42" style="background:rgba(35,67,224,.22)"></i><span>you”</span></span> <span class="hw"><i class="hb" id="s6b-h43" style="background:rgba(35,67,224,.22)"></i><span>“Tell</span></span> <span class="hw"><svg class="ring" viewBox="0 0 200 100" preserveAspectRatio="none"><path id="s6-ring2" pathLength="1" d="M22 58 C14 22 112 6 170 20 C206 32 198 80 128 90 C62 98 6 86 12 54 C16 34 50 22 92 18"/></svg><i class="hb" id="s6b-h44" style="background:rgba(35,67,224,.22)"></i><span>Dad</span></span> <span class="hw"><i class="hb" id="s6b-h45" style="background:rgba(35,67,224,.22)"></i><span>the</span></span> <span class="hw"><i class="hb" id="s6b-h46" style="background:rgba(35,67,224,.22)"></i><span>fence</span></span> <span class="hw"><i class="hb" id="s6b-h47" style="background:rgba(35,67,224,.22)"></i><span>he</span></span> <span class="hw"><i class="hb" id="s6b-h48" style="background:rgba(35,67,224,.22)"></i><span>‘fixed’</span></span> <span class="hw"><i class="hb" id="s6b-h49" style="background:rgba(35,67,224,.22)"></i><span>has</span></span> <span class="hw"><i class="hb" id="s6b-h50" style="background:rgba(35,67,224,.22)"></i><span>fallen</span></span> <span class="hw"><i class /span></span> Retirement looks good on you, though. Love you (yes, I’m allowed to say it once a year, stop rolling your eyes).</p><p class="rp" id="s6b-r-p1">That’s 43 words.</p><div class="m" id="s6-from" style="margin-top:22px;color:var(--pink);font-size:26px;opacity:0;position:relative">↑ From my texts. I never asked.</div></div></div><div class="pn" id="s6c" style="background:#DCE3DE;color:#111614"><div class="m tl" id="s6c-tl">Ep 07 — Anatomy of a prompt</div><div class="wm">igotchu<i>.</i></div><div class="prog"><i id="s6c-pb0" class="on"></i><i id="s6c-pb1" class="on"></i><i id="s6c-pb2" class="on"></i><i id="s6c-pb3" class="on"></i></div>
