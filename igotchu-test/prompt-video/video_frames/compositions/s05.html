ound:rgba(255,210,26,.9)"></i><span>under</span></span> <span class="hw"><i class="hb" id="s5b-h3" style="background:rgba(255,210,26,.9)"></i><span>fifty</span></span> <span class="hw"><i class="hb" id="s5b-h4" style="background:rgba(255,210,26,.9)"></i><span>words.</span></span> <span class="hw"><i class="hb" id="s5b-h5" style="background:rgba(255,210,26,.9)"></i><span>It’s</span></span> <span class="hw"><i class="hb" id="s5b-h6" style="background:rgba(255,210,26,.9)"></i><span>going</span></span> <span class="hw"><i class="hb" id="s5b-h7" style="background:rgba(255,210,26,.9)"></i><span>in</span></span> <span class="hw"><i class="hb" id="s5b-h8" style="background:rgba(255,210,26,.9)"></i><span>a</span></span> <span class="hw"><i class="hb" id="s5b-h9" style="background:rgba(255,210,26,.9)"></i><span>card,</span></span> <span class="hw"><i class="hb" id="s5b-h10" style="background:rgba(255,210,26,.9)"></i><span>so</span></span> <span class="hw"><i class="hb" id="s5b-h11" style="background:rgba(255,210,26,.9)"></i><span>no</span></span> <span class="hw"><i class="hb" id="s5b-h12" style="background:rgba(255,210,26,.9)"></i><span>emojis.</span></span> <span class="hw"><i class="hb" id="s5b-h13" style="background:rgba(255,210,26,.9)"></i><span>Don’t</span></span> <span class="hw"><i class="hb" id="s5b-h14" style="background:rgba(255,210,26,.9)"></i><span>say</span></span> <span class="hw"><i class="hb" id="s5b-h15" style="background:rgba(255,210,26,.9)"></i><span>‘queen’.</span></span></p></div><div class="rc full" id="s5b-r" style="left:1110px;top:170px;width:700px"><div class="hd"><span class="ai">AI</span><span class="m sm">Reply</span></div><p class="rp" id="s5b-r-p0">Happy 60th, Mum! <span class="hw"><i class="hb" id="s5b-r-q0" style="background:rgba(255,210,26,.9)"></i><span>Thirty</span></span> <span class="hw"><i class="hb" id="s5b-r-q1" style="background:rgba(255,210,26,.9)"></i><span>years</span></span> <span class="hw"><i class="hb" id="s5b-r-q2" style="background:rgba(255,210,26,.9)"></i><span>of</span></span> <span class="hw"><i class="hb" id="s5b-r-q3" style="background:rgba(255,210,26,.9)"></i><span>bossing</span></span> <span class="hw"><i class="hb" id="s5b-r-q4" style="background:rgba(255,210,26,.9)"></i><span>doctors</span></span> <span class="hw"><i class="hb" id="s5b-r-q5" style="background:rgba(255,210,26,.9)"></i><span>around,</span></span> <span class="hw"><i class="hb" id="s5b-r-q6" style="background:rgba(255,210,26,.9)"></i><span>and</span></span> <span class="hw"><i class="hb" id="s5b-r-q7" style="background:rgba(255,210,26,.9)"></i><span>now</span></span> <span class="hw"><i class="hb" id="s5b-r-q8" style="background:rgba(255,210,26,.9)"></i><span>you’re</span></span> <span class="hw"><i class="hb" id="s5b-r-q9" style="background:rgba(255,210,26,.9)"></i><span>free</span></span> <span class="hw"><i class="hb" id="s5b-r-q10" style="background:rgba(255,210,26,.9)"></i><span>to</span></span> <span class="hw"><i class="hb" id="s5b-r-q11" style="background:rgba(255,210,26,.9)"></i><span>boss</span></span> <span class="hw"><i class="hb" id="s5b-r-q12" style="background:rgba(255,210,26,.9)"></i><span>us</span></span> <span class="hw"><i class="hb" id="s5b-r-q13" style="background:rgba(255,210,26,.9)"></i><span>full-time.</span></span> Lucky us. Enjoy retirement. You’ve earned the lie-ins, the gossip and the right to diagnose everyone at dinner. Here’s to the next thirty. Love you (don’t make it weird).</p></div><div class="stamp" id="s5-stamp" style="left:1180px;top:380px">NO<br>QUEENS.</div><div class="stk" id="s5-stop" style="left:120px;top:800px;background:var(--ink);color:var(--paper)">Stops what you’d delete anyway</div></div></div>
